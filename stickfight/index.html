<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Last Contract</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* One full-screen pixel canvas. The game commits to a single neon-noir night look, so there is no light theme. */
:root {
  --bg: #07060f;
  --ink: #f3eee6;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
body {
  font-family: "Press Start 2P", ui-monospace, monospace;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#stage {
  position: fixed; left: 0; right: 0;
  top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
  overflow: hidden; touch-action: none; background: var(--bg);
}
#c { display: block; touch-action: none; image-rendering: crisp-edges; image-rendering: pixelated; }
#c:focus { outline: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" tabindex="0" aria-label="Last Contract. Tap the left or right side of the screen, or press A and D, to strike enemies on that side. Hold a side to run. Tap both sides, or press Space, for a ki attack."></canvas></div>
<script>
(() => {
'use strict';

// ============================================================ setup
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const FONT = '"Press Start 2P", ui-monospace, monospace';
const TAU = Math.PI * 2;
const OUT = '#06050c';

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - (1 - t) * (1 - t);
const mod = (a, n) => ((a % n) + n) % n;
function rng(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
const store = {
  get(k, d) { try { const v = localStorage.getItem('lastcontract.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('lastcontract.' + k, JSON.stringify(v)); } catch (e) {} },
};
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${Math.round((n >> 16) * k)},${Math.round((n >> 8 & 255) * k)},${Math.round((n & 255) * k)})`;
}
function vibrate(ms) { if (G.mode !== 'play') return; try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
const reducedMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const COARSE = (() => { try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } })();

const COL = {
  player: '#f2ede4', playerDark: '#9a93ad', tie: '#e0213c', hair: '#17121f',
  grunt: '#e0485e', brawler: '#ff8a2e', dodger: '#3fe0ff', gunman: '#ffc83a', boss: '#b77bff',
  shield: '#9fb4d8', ninja: '#52e88a', charger: '#ff5fd2',
  neon: ['#ff2e88', '#25e6ff', '#ffd23a', '#7cff6b', '#ff6a2e'],
  hud: '#f3eee6', dim: '#8d82b8', red: '#ff3355', gold: '#ffcf4a', ki: '#7ff3ff',
};
const SIGN_TEXT = ['HOTEL', 'BAR', 'NOODLE', 'CLUB', 'OPEN', '24H', 'RAMEN', 'TATTOO', 'DOJO', 'GUNS', 'BOOZE', 'SUSHI'];

// ============================================================ screen
let W = 360, H = 640, SCALE = 3, GY = 400, PORTRAIT = true, HALF = 180;
let skyGrad, hazeGrad, vignette, redVignette, stars = [], rain = [], splashes = [];
let farLayer, nearLayer, signs = [];
const FAR_W = 720, NEAR_W = 960, LAMP_GAP = 170;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.max(1, stage.clientWidth), ch = Math.max(1, stage.clientHeight);
  const dw = cw * dpr, dh = ch * dpr;
  PORTRAIT = ch > cw * 1.1;
  // Phones held upright get a closer camera so the fighters stay big; at least 260 world units stay visible.
  SCALE = Math.max(1, Math.floor(Math.min(dw / (PORTRAIT ? 260 : 300), dh / 250)));
  W = Math.ceil(dw / SCALE); H = Math.ceil(dh / SCALE);
  cv.width = W; cv.height = H;
  cv.style.width = (W * SCALE / dpr) + 'px';
  cv.style.height = (H * SCALE / dpr) + 'px';
  HALF = W / 2;
  GY = PORTRAIT ? Math.round(H * 0.64) : H - Math.max(44, Math.round(H * 0.2));
  ctx.imageSmoothingEnabled = false;

  skyGrad = ctx.createLinearGradient(0, 0, 0, GY);
  skyGrad.addColorStop(0, '#05041a');
  skyGrad.addColorStop(0.55, '#1a0b36');
  skyGrad.addColorStop(1, '#4a1141');
  hazeGrad = ctx.createLinearGradient(0, GY * 0.45, 0, GY);
  hazeGrad.addColorStop(0, 'rgba(255,60,140,0)');
  hazeGrad.addColorStop(1, 'rgba(255,60,140,0.22)');
  const r0 = Math.min(W, H) * 0.35, r1 = Math.max(W, H) * 0.75;
  vignette = ctx.createRadialGradient(W / 2, H / 2, r0, W / 2, H / 2, r1);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.6)');
  redVignette = ctx.createRadialGradient(W / 2, H / 2, r0, W / 2, H / 2, r1);
  redVignette.addColorStop(0, 'rgba(255,0,40,0)');
  redVignette.addColorStop(1, 'rgba(255,0,40,0.5)');

  const sr = rng(7);
  stars = [];
  for (let i = 0; i < 70; i++) stars.push({ x: sr() * W, y: sr() * GY * 0.6, p: sr() * 6, b: sr() < 0.2 });
  rain = [];
  const n = Math.round(W * H / 1500);
  for (let i = 0; i < n; i++) rain.push(newDrop(true));
  farLayer = makeCity(FAR_W, GY, 11, false);
  nearLayer = makeCity(NEAR_W, GY, 23, true);
}

function newDrop(init) {
  return { x: rand(-20, W + 20), y: init ? rand(-H, H) : rand(-40, -5), l: rand(4, 9), v: rand(280, 380), fy: rand(GY - 2, H) };
}

function makeCity(w, h, seed, near) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const r = rng(seed);
  const rp = a => a[Math.floor(r() * a.length)];
  const out = [];
  const minH = near ? Math.min(h * 0.28, 120) : Math.min(h * 0.4, 150);
  const maxH = near ? Math.min(h * 0.78, 330) : Math.min(h * 0.85, 360);
  let x = 0;
  while (x < w) {
    let bw = Math.floor(near ? 44 + r() * 70 : 26 + r() * 50);
    if (x + bw > w) bw = w - x;
    const bh = Math.floor(minH + r() * (maxH - minH));
    const top = h - bh;
    g.fillStyle = near ? '#0d0a1a' : '#1c1636';
    g.fillRect(x, top, bw, bh);
    if (r() < 0.5 && bw > 10) { const ax = x + 3 + Math.floor(r() * (bw - 6)); g.fillRect(ax, top - 8 - Math.floor(r() * 10), 1, 20); }
    if (near && r() < 0.35 && bw > 20) {
      const tx = x + 4 + Math.floor(r() * (bw - 16));
      g.fillRect(tx, top - 12, 10, 8); g.fillRect(tx + 1, top - 4, 1, 4); g.fillRect(tx + 8, top - 4, 1, 4);
    }
    g.fillStyle = near ? '#1d1634' : '#2a2150';
    g.fillRect(x, top, bw, 1);
    g.fillRect(x, top, 1, bh);
    const ww = near ? 2 : 1, wh = near ? 3 : 2, sx = near ? 5 : 3, sy = near ? 6 : 4;
    for (let wy = top + 5; wy < h - 6; wy += sy) {
      for (let wx = x + 3; wx < x + bw - 3; wx += sx) {
        const v = r();
        if (v < (near ? 0.16 : 0.2)) {
          g.fillStyle = near ? rp(['#ffcf6b', '#ffe9a8', '#7fe3ff', '#ff9ec4', '#ffb35c']) : rp(['#4b3a7a', '#6a4e8c', '#7d5a6a']);
          g.fillRect(wx, wy, ww, wh);
        } else if (near && v < 0.38) {
          g.fillStyle = '#161029';
          g.fillRect(wx, wy, ww, wh);
        }
      }
    }
    if (near && bh > 70 && r() < 0.6) {
      const text = rp(SIGN_TEXT);
      const vert = r() < 0.5;
      const sh = vert ? text.length * 9 + 4 : 12;
      const sw = vert ? 12 : text.length * 8 + 6;
      if (sw < bw + 20 && sh < bh - 20) {
        out.push({ x: x + Math.floor((bw - sw) / 2), y: top + 10 + Math.floor(r() * Math.max(1, Math.min(70, bh - sh - 24))), w: sw, h: sh, text, vert, col: rp(COL.neon), ph: r() * 10, flick: r() < 0.3 });
      }
    }
    x += bw + (near ? Math.floor(r() * 10) : 0);
  }
  if (near) signs = out;
  return c;
}

// ============================================================ audio
let AC = null, master, sfxBus, musBus, noiseBuf;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; return; }
  master = AC.createGain(); master.gain.value = G.muted ? 0 : 0.8; master.connect(AC.destination);
  sfxBus = AC.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
  musBus = AC.createGain(); musBus.gain.value = G.music ? 0.3 : 0; musBus.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  music.next = AC.currentTime + 0.1;
  setInterval(scheduleMusic, 25);
}
function envGain(at, a, d, peak) {
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(peak, at + a);
  g.gain.exponentialRampToValueAtTime(0.0001, at + a + d);
  return g;
}
function tone(type, f0, f1, dur, vol, at, dest) {
  at = at || AC.currentTime; dest = dest || sfxBus;
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, at);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  const g = envGain(at, 0.004, dur, vol);
  o.connect(g); g.connect(dest); o.start(at); o.stop(at + dur + 0.05);
}
function noise(dur, vol, ftype, f0, f1, q, at, dest) {
  at = at || AC.currentTime; dest = dest || sfxBus;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const fl = AC.createBiquadFilter(); fl.type = ftype; fl.Q.value = q || 1;
  fl.frequency.setValueAtTime(f0, at);
  if (f1 && f1 !== f0) fl.frequency.exponentialRampToValueAtTime(f1, at + dur);
  const g = envGain(at, 0.003, dur, vol);
  s.connect(fl); fl.connect(g); g.connect(dest);
  s.start(at, Math.random() * 0.5); s.stop(at + dur + 0.05);
}
const arp = (notes, gap, vol, type) => notes.forEach((f, i) => tone(type || 'square', f, f, 0.08, vol, AC.currentTime + i * gap));
const SFX = {
  punch() { tone('sine', 170, 45, 0.12, 0.9); noise(0.06, 0.6, 'lowpass', 2400, 400); },
  kick() { tone('sine', 130, 35, 0.18, 1); noise(0.09, 0.7, 'lowpass', 1800, 300); tone('square', 90, 40, 0.05, 0.12); },
  whoosh() { noise(0.16, 0.22, 'bandpass', 500, 2600, 1.5); },
  gun() { noise(0.16, 0.9, 'highpass', 3000, 700); tone('sine', 150, 40, 0.16, 0.9); noise(0.35, 0.25, 'lowpass', 900, 200); },
  enemyGun() { noise(0.12, 0.45, 'highpass', 2500, 900); tone('sine', 110, 50, 0.1, 0.4); },
  shotgun() { noise(0.4, 1, 'lowpass', 5000, 250); tone('sine', 90, 30, 0.3, 1); },
  slash() { noise(0.14, 0.55, 'bandpass', 2500, 7500, 2); tone('triangle', 1900, 900, 0.08, 0.08); },
  stab() { noise(0.05, 0.5, 'bandpass', 1800, 900, 3); tone('sine', 220, 80, 0.08, 0.5); },
  nunchaku() { noise(0.04, 0.6, 'bandpass', 2200, 1200, 2); tone('sine', 200, 60, 0.08, 0.6); noise(0.04, 0.6, 'bandpass', 2600, 1400, 2, AC.currentTime + 0.06); tone('sine', 220, 60, 0.08, 0.6, AC.currentTime + 0.06); },
  hammer() { tone('sine', 90, 28, 0.35, 1); noise(0.25, 0.9, 'lowpass', 1200, 120); tone('square', 60, 30, 0.12, 0.2); },
  block() { tone('square', 1200, 1150, 0.08, 0.14); tone('triangle', 2400, 2300, 0.12, 0.08); noise(0.04, 0.4, 'highpass', 4000, 3000); },
  parry() { tone('square', 1568, 1568, 0.25, 0.14); tone('square', 2093, 2093, 0.3, 0.09, AC.currentTime + 0.01); noise(0.05, 0.4, 'highpass', 5000, 3000); },
  hurt() { tone('sawtooth', 220, 70, 0.3, 0.35); noise(0.15, 0.5, 'lowpass', 1200, 200); },
  miss() { noise(0.12, 0.18, 'bandpass', 700, 1800, 1); tone('triangle', 260, 140, 0.12, 0.12); },
  pickup() { arp([660, 880, 1320], 0.055, 0.12); },
  combo() { arp([523, 659, 784, 1047], 0.05, 0.1); },
  named() { arp([784, 988, 1175, 1568], 0.04, 0.12); tone('sawtooth', 200, 800, 0.2, 0.08); },
  clear() { arp([392, 523, 659, 784, 1047, 1319], 0.07, 0.11); },
  die() { tone('sawtooth', 300, 40, 1.1, 0.3); noise(0.6, 0.4, 'lowpass', 1500, 100); },
  thud() { tone('sine', 80, 40, 0.1, 0.35); },
  empty() { tone('square', 900, 900, 0.03, 0.08); tone('square', 600, 600, 0.03, 0.08, AC.currentTime + 0.06); },
  kiReady() { tone('sine', 880, 1760, 0.15, 0.15); tone('triangle', 1320, 2640, 0.2, 0.08, AC.currentTime + 0.05); },
  kiBlast() { tone('sine', 300, 1400, 0.18, 0.35); noise(0.25, 0.5, 'bandpass', 900, 3000, 1.5); },
  kiHit() { tone('sine', 400, 120, 0.15, 0.6); noise(0.12, 0.6, 'bandpass', 2000, 600, 1); },
  boom() { noise(0.6, 1, 'lowpass', 3000, 80); tone('sine', 110, 28, 0.5, 1); },
  zip() { tone('square', 1800, 300, 0.06, 0.1); noise(0.05, 0.3, 'highpass', 6000, 3000); },
  charge() { tone('sawtooth', 110, 880, 0.8, 0.22); noise(0.8, 0.3, 'bandpass', 300, 3000, 2); tone('sine', 55, 110, 0.8, 0.4); },
  beam() { noise(1.1, 0.9, 'bandpass', 900, 250, 0.7); tone('sawtooth', 90, 60, 1.1, 0.35); tone('square', 230, 200, 1.1, 0.08); tone('sine', 60, 40, 1.1, 0.8); },
  power() { tone('sawtooth', 80, 640, 0.6, 0.25); arp([523, 784, 1047, 1568], 0.08, 0.12); noise(0.6, 0.4, 'highpass', 1000, 6000); },
};
const sfxLast = {};
function sfx(n) {
  if (!AC || G.muted || G.mode === 'title') return;
  const now = AC.currentTime;
  if (sfxLast[n] && now - sfxLast[n] < 0.03) return;
  sfxLast[n] = now;
  try { SFX[n] && SFX[n](); } catch (e) {}
}

// A minor-key darksynth loop: Am, F, C, G at 112 bpm. The lead arpeggio joins once the combo gets going.
const music = { next: 0, step: 0 };
const ROOTS = [45, 41, 48, 43];
const CHORDS = [[57, 60, 64], [53, 57, 60], [55, 60, 64], [55, 59, 62]];
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
function scheduleMusic() {
  if (!AC || AC.state !== 'running') return;
  const spb = 60 / 112 / 4;
  if (music.next < AC.currentTime - 0.2) music.next = AC.currentTime + 0.05;
  while (music.next < AC.currentTime + 0.12) {
    const t = music.next, s = music.step % 16, bar = Math.floor(music.step / 16) % 4;
    const on = G.music && !G.muted && !G.paused;
    if (on) {
      const root = ROOTS[bar];
      if (s % 4 === 0) tone('sine', 150, 42, 0.22, 0.9, t, musBus);
      if (s === 4 || s === 12) { noise(0.12, 0.35, 'bandpass', 1800, 1200, 1, t, musBus); tone('triangle', 190, 160, 0.06, 0.15, t, musBus); }
      if (s % 2 === 1) noise(0.03, 0.12, 'highpass', 7000, 7000, 1, t, musBus);
      if ([0, 2, 3, 6, 8, 10, 11, 14].includes(s)) {
        const n = root + (s === 3 || s === 11 ? 12 : 0);
        const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(mtof(n), t);
        const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(220, t + 0.14); f.Q.value = 6;
        const g = envGain(t, 0.005, 0.15, 0.35);
        o.connect(f); f.connect(g); g.connect(musBus); o.start(t); o.stop(t + 0.2);
      }
      if (G.mode === 'play' && (player.combo >= 10 || player.super > 0)) {
        const ch = CHORDS[bar];
        tone('square', mtof(ch[s % 3] + (player.super > 0 ? 24 : 12)), 0, 0.07, 0.06, t, musBus);
      }
    }
    music.next += spb;
    music.step++;
  }
}
function applyVolumes() {
  if (!AC) return;
  master.gain.setTargetAtTime(G.muted ? 0 : 0.8, AC.currentTime, 0.02);
  musBus.gain.setTargetAtTime(G.music ? 0.3 : 0, AC.currentTime, 0.02);
}

// ============================================================ skeleton + poses
// Poses are local to the fighter: x points the way they face, y is height above the ground.
// [hipX, hipY, torsoLean, hand1X, hand1Y, hand2X, hand2Y, foot1X, foot1Y, foot2X, foot2Y]
// Elbows and knees are solved with two-bone IK, so a pose only says where the hands and feet go.
const BODY = { ua: 6.5, la: 6.5, th: 8.5, sh: 8.5, torso: 11, neck: 1.5, head: 3.6 };
const IDLE     = [0, 15, 0.12, 8, 25, 5, 23, 5, 0, -5, 0];
const EGUARD   = [0, 15, 0.08, 7, 22, 3, 20, 4, 0, -4, 0];
const JAB      = [3, 15, 0.25, 17, 26, 5, 24, 9, 0, -5, 0];
const CROSS    = [5, 14.5, 0.4, 7, 24, 21, 25, 10, 0, -4, 0];
const HKICK    = [-1, 16, -0.35, -3, 24, 3, 27, 18, 22, -3, 0];
const UPPER    = [3, 13.5, 0, 8, 35, 4, 23, 7, 0, -6, 0];
const SPIN0    = [0, 15, 0.3, -3, 25, 6, 24, 4, 0, -3, 1];
const SPIN1    = [-2, 17, -0.45, -8, 26, -3, 24, -4, 0, 17, 19];
const KNEE     = [5, 24, 0.2, 12, 31, 10, 32, 7, 16, -6, 10];
const SWEEP    = [0, 7, 0.35, -6, 3, 5, 13, 19, 1, -4, 0];
const GRAB     = [4, 13, 0.35, 14, 27, 13, 25, 8, 0, -5, 0];
const TOSS     = [-2, 14, -0.55, -9, 31, -7, 29, 6, 0, -7, 0];
const BACKFIST = [2, 15, -0.05, 18, 28, -2, 22, 7, 0, -6, 0];
const AXE0     = [0, 15, -0.25, -4, 25, 3, 27, 7, 31, -4, 0];
const AXE1     = [3, 13, 0.3, 6, 22, 2, 21, 15, 4, -5, 0];
const HEADBUTT = [5, 14, 0.7, 4, 20, 2, 20, 9, 0, -5, 0];
const PALM     = [5, 14, 0.3, 19, 24, 18, 22, 10, 0, -5, 0];
const SUPER0   = [-3, 14, -0.1, -4, 22, 4, 26, 2, 0, -9, 4];
const SUPER1   = [8, 22, 0.5, 22, 26, -4, 24, 2, 12, -10, 16];
const DROPK    = [4, 20, -0.9, -6, 18, -4, 14, 20, 22, 18, 18];
const RISE     = [4, 30, 0.1, 9, 48, 4, 34, 6, 20, -2, 16];
const AIRK     = [2, 18, -0.3, -2, 28, 3, 30, 17, 24, -4, 10];
const CHARGEP  = [-2, 14, -0.15, -8, 19, -7, 18, 7, 0, -7, 0];
const BEAMP    = [3, 14, 0.15, 18, 24, 17, 23, 9, 0, -8, 0];
const SWING0   = [-2, 15, -0.3, -6, 36, -5, 35, 6, 0, -6, 0];
const SWING1   = [5, 12, 0.6, 16, 6, 15, 7, 10, 0, -5, 0];
const THROWW0  = [-2, 15, -0.25, -9, 32, 6, 24, 6, 0, -6, 0];
const THROWW1  = [5, 15, 0.4, 16, 30, 2, 22, 9, 0, -5, 0];
const GUN      = [1, 15, 0.05, 15, 27, 12, 26, 6, 0, -6, 0];
const DUAL     = [1, 15, 0.05, 15, 27, 15, 24, 6, 0, -6, 0];
const GUNR     = [-1, 15, -0.1, 12, 30, 10, 28, 6, 0, -6, 0];
const GUNIDLE  = [0, 15, 0.08, 11, 21, 6, 21, 5, 0, -5, 0];
const SHOT     = [0, 15, 0, 15, 25, 10, 24, 7, 0, -6, 0];
const SLASH0   = [-1, 15, -0.15, -2, 34, 0, 33, 6, 0, -6, 0];
const SLASH1   = [4, 13, 0.45, 16, 12, 14, 13, 10, 0, -5, 0];
const SLASH2   = [3, 14, 0.2, 16, 33, 13, 32, 9, 0, -5, 0];
const KIDLE    = [0, 15, 0.15, 9, 20, 7, 21, 6, 0, -5, 0];

function walkPose(ph, fast) {
  const s = Math.sin(ph), c = Math.cos(ph);
  const st = fast ? 8 : 6, lift = fast ? 5 : 3, sw = fast ? 6 : 3;
  return [0, 15 + Math.abs(c) * (fast ? 0.8 : 0.4), fast ? 0.3 : 0.15,
    6 - s * sw, 22, 2 + s * sw, 21,
    s * st, Math.max(0, c) * lift, -s * st, Math.max(0, -c) * lift];
}
function runPose(ph) {
  const p = walkPose(ph, true);
  p[2] = 0.45; p[3] = 8 - Math.sin(ph) * 8; p[4] = 23; p[5] = 2 + Math.sin(ph) * 8; p[6] = 22;
  p[7] *= 1.3; p[9] *= 1.3;
  return p;
}

function ik(a, t, l1, l2, px, py) {
  const dx = t.x - a.x, dy = t.y - a.y;
  const d = Math.hypot(dx, dy) || 0.001;
  const dc = clamp(d, Math.abs(l1 - l2) + 0.01, l1 + l2 - 0.01);
  const ux = dx / d, uy = dy / d;
  const ang = Math.acos(clamp((l1 * l1 + dc * dc - l2 * l2) / (2 * l1 * dc), -1, 1));
  const base = Math.atan2(uy, ux);
  const j1 = { x: a.x + Math.cos(base + ang) * l1, y: a.y + Math.sin(base + ang) * l1 };
  const j2 = { x: a.x + Math.cos(base - ang) * l1, y: a.y + Math.sin(base - ang) * l1 };
  const mx = a.x + ux * dc * 0.5, my = a.y + uy * dc * 0.5;
  const s1 = (j1.x - mx) * px + (j1.y - my) * py, s2 = (j2.x - mx) * px + (j2.y - my) * py;
  return [s1 >= s2 ? j1 : j2, { x: a.x + ux * dc, y: a.y + uy * dc }];
}

function solveFig(p, x, f, s, lift, rot) {
  const gy = GY - (lift || 0);
  const hip = { x: x + p[0] * f * s, y: gy - p[1] * s };
  const sl = Math.sin(p[2]), cl = Math.cos(p[2]);
  const neck = { x: hip.x + sl * f * BODY.torso * s, y: hip.y - cl * BODY.torso * s };
  const sh = { x: lerp(neck.x, hip.x, 0.1), y: lerp(neck.y, hip.y, 0.1) };
  const hd = (BODY.neck + BODY.head) * s;
  const head = { x: neck.x + sl * f * hd, y: neck.y - cl * hd };
  const T = (px, py) => ({ x: x + px * f * s, y: gy - py * s });
  const [e1, h1] = ik(sh, T(p[3], p[4]), BODY.ua * s, BODY.la * s, -f * 0.4, 1);
  const [e2, h2] = ik(sh, T(p[5], p[6]), BODY.ua * s, BODY.la * s, -f * 0.4, 1);
  const [k1, f1] = ik(hip, T(p[7], p[8]), BODY.th * s, BODY.sh * s, f, -0.2);
  const [k2, f2] = ik(hip, T(p[9], p[10]), BODY.th * s, BODY.sh * s, f, -0.2);
  const J = { head, neck, sh, hip, e1, h1, e2, h2, k1, f1, k2, f2 };
  if (rot) {
    const c = Math.cos(rot), sn = Math.sin(rot), ox = hip.x, oy = hip.y;
    for (const k in J) {
      const q = J[k], rx = q.x - ox, ry = q.y - oy;
      J[k] = { x: ox + rx * c - ry * sn, y: oy + rx * sn + ry * c };
    }
  }
  return J;
}

function play(e, keys) {
  e.anim = { keys: [[0, e.pose.slice()], ...keys], t: 0, dur: keys[keys.length - 1][0] };
}
function animate(e, dt, base) {
  const a = e.anim;
  if (a) {
    a.t += dt;
    const k = a.keys;
    if (a.t >= a.dur) { e.pose = k[k.length - 1][1].slice(); e.anim = null; return; }
    let i = 0;
    while (i < k.length - 2 && a.t > k[i + 1][0]) i++;
    const t0 = k[i][0], t1 = k[i + 1][0];
    const u = easeOut(clamp((a.t - t0) / ((t1 - t0) || 1), 0, 1));
    for (let j = 0; j < 11; j++) e.pose[j] = lerp(k[i][1][j], k[i + 1][1][j], u);
    return;
  }
  const kk = 1 - Math.exp(-dt * 18);
  for (let j = 0; j < 11; j++) e.pose[j] += (base[j] - e.pose[j]) * kk;
}

function updWave(dt) {

    G.between -= dt;
    if (G.between <= 0) startWave(G.wave + 1);

  const alive = enemies.filter(e => !e.dead).length;
  if (G.waveSpawned < G.waveTotal) {
    G.spawnT -= dt;
    if (G.spawnT <= 0 && alive < G.maxAlive) {
      const side = Math.random() < 0.5 ? -1 : 1;
      spawnEnemy(G.boss && G.waveSpawned === 1 ? 'boss' : chooseType(G.wave), side);
      G.waveSpawned++;

      if (G.wave >= 3 && Math.random() < 0.3 && G.waveSpawned < G.waveTotal) { spawnEnemy(chooseType(G.wave), -side); G.waveSpawned++; }
      G.spawnT = G.spawnGap * rand(0.6, 1.4);

    G.between = 2.8;
    const healed = G.wave % 2 === 0 && player.hp < player.maxHp;
    if (healed) player.hp++;

function aiThink(dt) {

  if (player.ki >= 200 && Math.random() < 0.3) { special(); G.aiT = 0.5; return; }
  for (const b of bullets) {
    if (!b.ref && Math.sign(b.vx) === Math.sign(player.x - b.x) && Math.abs(b.x - player.x) < 50) { act(Math.sign(b.x - player.x)); G.aiT = 0.1; return; }
  }
  let best = null, near = null;
  for (const S of [-1, 1]) {
    const n = nearestEnemy(S);
    if (!n) continue;
    const d = Math.abs(n.x - player.x);
    if (!near || d < near.d) near = { S, d };
    if (!plan(S)) continue;
    const u = n.state === 'windup' || n.state === 'aim' || n.state === 'charge' ? 0 : d;
    if (!best || u < best.u) best = { S, u };
  }
  if (best) { player.run = 0; act(best.S); G.aiT = rand(0.06, 0.3); }
  else { player.run = near && near.d < 150 ? near.S : 0; G.aiT = 0.05; }
}

  if (c.length && G.t - c[c.length - 1].t > CHAIN_GAP) c.length = 0;
  c.push({ S, t: G.t, air });
  if (c.length > 8) c.shift();
  const n = c.length, s = c.map(x => x.S > 0 ? 'R' : 'L').join('');
  if (n >= 3 && c.slice(-3).every(x => x.air)) award('SKY JUGGLER');
  else if (n >= 6 && c[n - 1].t - c[n - 6].t < 1.6) award('HURRICANE');
  else if (/(LRLR|RLRL)$/.test(s)) award('CROSSFIRE');
  else if (/(LLRR|RRLL)$/.test(s)) award('PENDULUM');
}
function award(name) {
  G.chain = [];
  const pts = 300 * mult();
  G.score += pts;
  gainKi(30);
  G.named = { s: name, sub: '+' + pts, t: 0 };
  sfx('named');
  flash('#7ff3ff', 0.08);
}
function gainKi(v) {
  const before = Math.floor(player.ki / 100);
  player.ki = Math.min(KI_MAX, player.ki + v * (player.super > 0 ? 1.5 : 1));
  const after = Math.floor(player.ki / 100);
  if (after > before && G.mode === 'play') {
    sfx('kiReady');
    text(player.x, GY - 60, after === 3 ? 'KI MAX' : SPECIALS[after] + ' READY', COL.ki, 8, 1);
  }
}

// What a tap on side S would do right now, or null if it would whiff.
function plan(S) {
  const b = bullets.find(b => !b.ref && (b.x - player.x) * S > 0 && Math.abs(b.x - player.x) < 70 && Math.sign(b.vx) === -S);
  if (b) return () => parry(b, S);
  const w = player.weapon;
  const n = nearestEnemy(S);
  const d = n ? Math.abs(n.x - player.x) : Infinity;
  const r = n ? reachOf(n) : 0;
  if (n) {
    if ((w === 'pistol' || w === 'dual') && d < HALF - 4) return () => shootPistol(n, S);
    if (w === 'axe' && d < HALF - 4) return () => throwAxe(S);
    if (w === 'grenade' && d < 170) return () => throwNade(n, S);
    if (w === 'shotgun') { const tg = enemiesOnSide(S, SHOTGUN_R); if (tg.length) return () => shootShotgun(tg, S); }
    if (w === 'katana') { const tg = enemiesOnSide(S, KATANA_R + (player.super > 0 ? 10 : 0)).slice(0, 2); if (tg.length) return () => slash(tg, S); }
    if (w === 'pencil' && d <= r) return () => stab(n, S);
    if (w === 'nunchaku' && d <= r + 10) return () => nunchaku(n, S);
    if (w === 'hammer' && d <= r + 8) return () => hammer(n, S);
    if (d <= r) return n.state === 'air' ? () => airStrike(n, S) : () => melee(n, S);
    if (d <= DASH && (n.type === 'gunman' || n.state === 'aim' || n.state === 'throw')) return () => slide(n, S);
  }
  const it = items.find(i => (i.type !== 'heart' || player.hp < player.maxHp) && (i.x - player.x) * S > 0 && Math.abs(i.x - player.x) < 90);
  if (it) return () => {
    player.lunge = { x0: player.x, x1: it.x, t: 0, dur: 0.12 };
    play(player, [[0.05, RUN], [0.14, RUN], [0.24, IDLE]]);
    player.lock = 0.14; dust(player.x, 4); sfx('whoosh');
  };
  return null;
}
function act(S) {
  if (G.mode === 'play') G.taps++;
  padFlash[S < 0 ? 0 : 1] = 1;
  player.f = S;
  const f = plan(S);
  if (!f) { whiff(S); return; }
  const n = nearestEnemy(S);
  const air = !!(n && n.state === 'air');
  const hit = n && Math.abs(n.x - player.x) <= DASH + HALF;
  f();
  if (hit && !player.dead) recordChain(S, air);
}

function melee(e, S) {
  let m = pickMove(e), dmg = meleeDmg(1), bonus = null;
  const triple = isTriple(S);
  if (player.runT < 0.25) { m = pick(['dropkick', 'superman']); dmg += 1; bonus = 'RUNNING STRIKE'; }
  if (triple) {
    G.chain = [];
    const pts = 200 * mult(); G.score += pts; gainKi(20);
    G.named = { s: 'TRIPLE THREAT', sub: '+' + pts, t: 0 }; sfx('named');
    // The third hit launches anyone it doesn't kill, ready to juggle.
    m = e.hp > dmg && e.type !== 'boss' && e.type !== 'charger' ? 'rise' : pick(['spin', 'superman', 'axe']);
  }
  const M = MOVES[m];
  const hitT = M.hitT || 0.045;
  player.lunge = { x0: player.x, x1: e.x - S * 13 * e.s, t: 0, dur: Math.min(0.06, hitT) };
  play(player, M.k);
  freeze(e, hitT + 0.12);
  player.lock = Math.max(0.11, hitT + 0.06);
  if (M.whoosh) sfx('whoosh');
  player.pending = {
    t: hitT, fn: () => {
      if (e.dead) return;
      if (M.ki) addP({ k: 'ring', x: e.x, y: GY - 22, r: 3, life: 0.2, col: COL.ki });
      hitEnemy(e, dmg, S, M.imp, { snd: M.snd, spin: M.spin, low: M.low, melee: true, launch: m === 'rise', bonus });
    },
  };
}
function airStrike(e, S) {

  player.lunge = { x0: player.x, x1: e.x - S * 12 * e.s, t: 0, dur: 0.06 };
  player.hop = { t: 0, dur: 0.4, h: Math.max(10, e.lift + 4) };

function parry(b, S) {

// ------------------------------------------------------------ ki specials
function special() {
  if (G.mode !== 'play' && G.mode !== 'title') return;
  if (player.dead || player.rush || player.beam) return;
  if (player.lock > 0 || player.pending) { player.queueSpecial = true; return; }
  const bars = Math.floor(player.ki / 100);
  if (bars < 1) { text(player.x, GY - 50, 'NO KI', COL.dim, 8, 0.6); sfx('empty'); return; }
  const l = enemiesOnSide(-1, HALF).length, r = enemiesOnSide(1, HALF).length;
  const S = l === r ? player.f : r > l ? 1 : -1;
  player.run = 0;
  if (bars >= 3) { player.ki -= 300; startBeam(S); }
  else if (bars === 2 && l + r > 0) { player.ki -= 200; startRush(); }
  else { player.ki -= 100; kiBlast(S, l, r); }
}
function kiBlast(S, l, r) {
  play(player, [[0.05, PALM], [0.2, PALM], [0.34, IDLE]]);
  player.f = S; player.lock = 0.22;
  const sides = l && r ? [-1, 1] : [S];

    bullets.push({ x: player.x + s * 14, y: GY - 23, vx: s * 360, ref: true, kind: 'ki', dmg: 5 });
    addP({ k: 'muzzle', x: player.x + s * 14, y: GY - 23, r: 7, life: 0.1, col: '#bff6ff' });
  }
  sfx('kiBlast'); shake(4); flash('#bff6ff', 0.12);
  G.named = { s: 'KI BLAST', sub: '', t: 0 };
}
function startRush() {
  const list = enemies.filter(e => targetable(e) && Math.abs(e.x - player.x) < HALF + 10)
    .sort((a, b) => Math.abs(a.x - player.x) - Math.abs(b.x - player.x)).slice(0, 8);
  list.forEach(e => freeze(e, 3));
  player.rush = { list, i: 0, t: 0.18 };
  player.inv = 99; player.lunge = null; player.pending = null; player.hop = null;
  play(player, [[0.15, CHARGEP]]);

function updRush(dt) {
  const R = player.rush;
  R.t -= dt;

  if (R.t > 0) return;

    player.rush = null; player.inv = 0.6; player.lock = 0.2;
    play(player, [[0.15, IDLE]]);

  }
  const e = R.list[R.i++];

  R.t = 0.11;
  ghost();
  const S = Math.sign(e.x - player.x) || player.f;
  player.x = e.x - S * 12 * e.s; player.f = S;
  smoke(player.x, GY - 18, 3);
  const m = pick(['jab', 'cross', 'kick', 'knee', 'spin', 'upper', 'palm', 'axe']);
  const strike = MOVES[m].k.length > 3 ? MOVES[m].k[1][1] : MOVES[m].k[0][1];
  player.pose = strike.slice(); player.anim = null;
  sfx('zip');
  hitEnemy(e, e.type === 'boss' ? 3 : 4, S, MOVES[m].imp, { heavy: true, snd: 'kick', stop: 0.03, spin: 6, noKi: true });

function startBeam(S) {
  player.beam = { S, t: 0, phase: 'charge', hit: new Set() };

  play(player, [[0.15, CHARGEP]]);

function updBeam(dt) {
  const B = player.beam;
  B.t += dt;
  player.f = B.S;
  const hand = player.J ? player.J.h1 : { x: player.x, y: GY - 20 };
  if (B.phase === 'charge') {
    shake(1 + B.t * 3);
    for (let i = 0; i < 3; i++) {
      const a = rand(0, TAU), d = rand(20, 50);
      addP({ k: 'sq', x: hand.x + Math.cos(a) * d, y: hand.y + Math.sin(a) * d, vx: -Math.cos(a) * d * 4, vy: -Math.sin(a) * d * 4, life: 0.25, col: pick([COL.ki, '#ffffff']), g: 0, sz: 1 });
    }
    if (B.t >= 0.8) {
      B.phase = 'fire'; B.t = 0;
      play(player, [[0.05, BEAMP]]);
      sfx('beam'); flash('#bff6ff', 0.4);
      G.named = { s: 'SPIRIT CANNON', sub: '', t: 0 };
    }
    return;
  }
  shake(5);
  for (const e of enemies) {
    if (e.dead || B.hit.has(e) || (e.x - player.x) * B.S <= 0 || Math.abs(e.x - player.x) > HALF + 40) continue;
    B.hit.add(e);
    hitEnemy(e, e.type === 'boss' ? 7 : 99, B.S, [rand(300, 420), rand(180, 300)], { heavy: true, stop: 0, spin: 10, noKi: true });
  }
  for (const b of bullets) if (!b.ref && (b.x - player.x) * B.S > 0) b.done = true;
  for (const e of enemies) {
    if (e.dead || e.state === 'jump' || e.state === 'stagger' || (e.x - player.x) * B.S > 0 || Math.abs(e.x - player.x) > 80) continue;
    e.state = 'stagger'; e.st = 0.5; e.vx = -B.S * 150; e.anim = null;
  }
  if (Math.random() < 0.8) addP({ k: 'spark', x: hand.x + B.S * rand(10, HALF), y: hand.y + rand(-6, 6), vx: B.S * 300, vy: rand(-40, 40), life: 0.2, col: COL.ki, g: 0 });
  if (B.t >= 1.0) {
    player.beam = null; player.inv = 0.5; player.lock = 0.25;
    play(player, [[0.2, IDLE]]);
  }
}

// ------------------------------------------------------------ damage
function hitEnemy(e, dmg, S, imp, o) {
  if (e.dead) return;
  o = o || {};
  const J = e.J || solveFig(e.pose, e.x, e.f, e.s, e.lift, e.rot);
  // Shields stop anything light that comes from the front.
  if (e.guard && !o.heavy && S === -e.f && e.state !== 'air') {
    if (o.bullet) {
      sparks(e.x - S * 6, J.head.y + 6, -S, '#c9d8ff', 6);
      text(e.x, J.head.y - 12, 'BLOCKED', COL.shield, 8, 0.6);
      sfx('block');
      return;
    }
    e.guard = false;
    addP({ k: 'sq', x: e.x - S * 6, y: GY - 22, vx: S * 60, vy: -200, life: 1.2, col: COL.shield, g: 600, sz: 3, bounce: true });
    sparks(e.x - S * 6, GY - 22, S, '#c9d8ff', 8);
    text(e.x, J.head.y - 12, 'GUARD BREAK', COL.shield, 8, 0.8);

function hurtPlayer(src, dmg) {

  player.hp -= dmg || 1;

  if ((dmg || 1) > 1) text(player.x, GY - 50, '-' + dmg, COL.red, 8, 0.8);
  for (const o of enemies) {

function killPlayer(src) {

  player.dead = true; player.run = 0;
  const S = src ? Math.sign(player.x - src.x) || 1 : -player.f;
  const J = solveFig(player.pose, player.x, player.f, 1, 0, 0);

// ============================================================ ragdolls
const RD_N = ['head', 'neck', 'sh', 'hip', 'e1', 'h1', 'e2', 'h2', 'k1', 'f1', 'k2', 'f2'];
const RD_S = [['head', 'neck'], ['neck', 'sh'], ['sh', 'hip'], ['neck', 'hip'], ['sh', 'e1'], ['e1', 'h1'], ['sh', 'e2'], ['e2', 'h2'], ['hip', 'k1'], ['k1', 'f1'], ['hip', 'k2'], ['k2', 'f2'], ['head', 'hip']];
function spawnRagdoll(J, vx, vy, col, dark, lw, s, spin) {
  const P = {};
  for (const n of RD_N) {
    const p = J[n], rx = p.x - J.hip.x, ry = p.y - J.hip.y;
    P[n] = { x: p.x, y: p.y, vx: vx - ry * spin, vy: vy + rx * spin };
  }
  const sticks = RD_S.map(([a, b]) => [P[a], P[b], Math.hypot(P[a].x - P[b].x, P[a].y - P[b].y)]);
  ragdolls.push({ P, sticks, col, dark, lw, s, life: 0, flash: 0.06, hit: new Set(), landed: false });
  if (ragdolls.length > 22) ragdolls.shift();
}
function updRagdolls(dt) {
  const g = 900;
  for (const r of ragdolls) {
    r.life += dt; r.flash -= dt;
    for (const n of RD_N) {
      const p = r.P[n];
      p.vy += g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const floor = n === 'head' ? GY - BODY.head * r.s : GY;
      if (p.y > floor) {
        if (!r.landed && p.vy > 200 && n === 'hip') { r.landed = true; sfx('thud'); dust(p.x, 4); }
        p.y = floor; p.vy *= -0.3; p.vx *= 0.7;
      }
    }
    for (let it = 0; it < 4; it++) {
      for (const [a, b, len] of r.sticks) {
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.001;
        const k = (d - len) / d * 0.5;
        a.x += dx * k; a.y += dy * k; b.x -= dx * k; b.y -= dy * k;
      }
    }
    // Keep velocities consistent with the constraint corrections.
    if (!r.prev) r.prev = {};
    for (const n of RD_N) {
      const p = r.P[n], q = r.prev[n];
      if (q && dt > 0) { p.vx = lerp(p.vx, (p.x - q.x) / dt, 0.5); p.vy = lerp(p.vy, (p.y - q.y) / dt, 0.5); }
      r.prev[n] = { x: p.x, y: p.y };
    }
    // Flying bodies knock over whoever they land on.
    if (G.mode !== 'title' && r.life < 1.2) {
      const h = r.P.hip, sp = Math.hypot(h.vx, h.vy);
      if (sp > 140 && h.y > GY - 34) {
        for (const e of enemies) {
          if (e.dead || e.state === 'jump' || r.hit.has(e) || Math.abs(e.x - h.x) > 9) continue;
          r.hit.add(e);
          hitEnemy(e, 1, Math.sign(h.vx) || 1, [Math.abs(h.vx) * 0.8, 160], { snd: 'kick', noCombo: true, heavy: true, bonus: 'COLLATERAL', spin: 6 });
        }
      }
    }
  }
  ragdolls = ragdolls.filter(r => r.life < 7);
}

// ============================================================ updates
function updPlayer(dt) {
  player.inv = Math.max(0, player.inv - dt);
  player.super = Math.max(0, player.super - dt);
  if (player.dead) return;
  if ((player.super > 0 || player.ki >= KI_MAX) && Math.random() < dt * 40) {
    addP({ k: 'aura', x: player.x + rand(-7, 7), y: GY - player.lift - rand(2, 34), vx: rand(-8, 8), vy: rand(-70, -30), life: rand(0.25, 0.45), col: player.super > 0 ? pick([COL.gold, '#fff6c0']) : pick([COL.ki, '#ffffff']), sz: randi(1, 2) });
  }
  if (player.rush || player.beam) { animate(player, dt, IDLE); return; }
  if (player.lunge) {
    const L = player.lunge;
    L.t += dt;
    const u = Math.min(1, L.t / L.dur);
    player.x = lerp(L.x0, L.x1, easeOut(u));
    if (u >= 1) player.lunge = null;
  }
  if (player.hop) {
    const P = player.hop;
    P.t += dt;
    player.lift = P.h * Math.sin(Math.PI * Math.min(1, P.t / P.dur));
    if (P.t >= P.dur) { player.hop = null; player.lift = 0; }
  }
  if (player.pending) {
    player.pending.t -= dt;
    if (player.pending.t <= 0) { const fn = player.pending.fn; player.pending = null; fn(); }
  }
  player.lock -= dt;
  if (player.lock <= 0 && !player.pending) {
    if (player.queueSpecial) { player.queueSpecial = false; special(); }
    else if (player.queue) { const q = player.queue; player.queue = 0; act(q); }
  }
  // Holding a side runs toward it, stopping once the nearest enemy there is in reach.
  player.running = false;
  if (player.run && player.lock <= 0 && !player.pending && !player.hop) {
    const S = player.run;
    const n = nearestEnemy(S);
    const blocked = n && Math.abs(n.x - player.x) <= reachOf(n) - 3;
    player.f = S;
    if (!blocked) {
      player.anim = null;
      player.x += S * RUN_SPEED * dt;
      player.runPh += dt * RUN_SPEED * 0.2;
      player.running = true; player.runT = 0;
      if (Math.random() < dt * 14) dust(player.x - S * 4, 1);
      if (Math.random() < dt * 10) G.ghosts.push({ J: solveFig(player.pose, player.x, player.f, 1, 0, 0), t: 0, life: 0.15, col: '#8d82b8' });
    }
  }
  player.runT += dt;
  if (!player.anim && player.lock <= 0 && !player.run) {
    let bd = 1e9, f = player.f;
    for (const e of enemies) { if (e.dead) continue; const d = Math.abs(e.x - player.x); if (d < bd) { bd = d; f = Math.sign(e.x - player.x) || f; } }
    player.f = f;
  }
  let base;
  const w = player.weapon;
  if (player.running) base = runPose(player.runPh);
  else if (w === 'pistol' || w === 'shotgun' || w === 'dual') base = GUNIDLE;
  else if (w === 'katana' || w === 'hammer') base = KIDLE;
  else { base = IDLE.slice(); base[1] += Math.sin(G.t * 7) * 0.5; base[4] += Math.sin(G.t * 7 + 1) * 0.6; }
  animate(player, dt, base);
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (it.grounded && Math.abs(it.x - player.x) < 13) { items.splice(i, 1); equip(it.type); }
  }
}

function basePose(e) {
  switch (e.state) {
    case 'walk': return e.moving ? walkPose(e.ph, e.fast) : (e.type === 'gunman' ? AIMLOW : e.guard ? SHIELDP : EGUARD);
    case 'windup': case 'throw': return WINDUP;
    case 'aim': return AIM;
    case 'stagger': return HURT;
    case 'air': return AIRHURT;
    case 'jump': return TUCK;
    case 'rev': return REV;
    case 'charge': return runPose(e.ph);
    default: return e.type === 'gunman' ? AIMLOW : e.guard ? SHIELDP : EGUARD;
  }
}

function updEnemy(e, dt) {
  e.flash = Math.max(0, e.flash - dt);
  const dx = player.x - e.x, dist = Math.abs(dx), dir = Math.sign(dx) || e.f;
  if (e.state !== 'jump' && e.state !== 'charge' && e.state !== 'air') e.f = dir;
  if (player.dead && e.state !== 'jump' && e.state !== 'stagger' && e.state !== 'air') { e.state = 'recover'; e.st = 1; e.moving = false; }
  switch (e.state) {
    case 'walk': {
      const ranged = e.type === 'gunman';
      const range = ranged ? e.keep : 15 * e.s;
      let blocked = false;
      if (!ranged) {
        for (const o of enemies) {
          if (o === e || o.dead || o.state === 'jump' || o.state === 'air' || o.type === 'gunman') continue;
          const od = player.x - o.x;
          if (Math.sign(od) === dir && Math.abs(od) < dist && dist - Math.abs(od) < 12 * Math.max(e.s, o.s)) { blocked = true; break; }
        }
      }
      e.fast = dist > 190 || e.type === 'ninja';
      if (dist > range && !blocked) {
        const sp = e.spd * (dist > 190 ? 1.8 : 1);
        e.x += dir * Math.min(sp * dt, dist - range);
        e.ph += dt * sp * 0.22;
        e.moving = true;
      } else e.moving = false;
      if (dist <= range + 0.5) {
        if (ranged) { e.state = 'aim'; e.st = G.aimTime; }
        else {
          e.state = 'windup';
          e.st = G.windup * ({ brawler: 1.25, boss: 1.3, charger: 1.3, ninja: 0.6, shield: 1.1 }[e.type] || 1);
          play(e, [[Math.min(0.18, e.st * 0.6), WINDUP]]);
        }
      } else if (e.type === 'boss' && dist < 170 && dist > 50) {
        e.knifeT -= dt;
        if (e.knifeT <= 0) { e.state = 'throw'; e.st = 0.45; e.knifeT = rand(2.2, 3.5); }
      } else if (e.type === 'ninja' && !e.thrown && dist < 100 && dist > 40) {
        e.state = 'throw'; e.st = 0.3; e.thrown = true;
      } else if (e.type === 'charger' && dist < 135 && dist > 55 && !blocked) {
        e.chargeCD -= dt;
        if (e.chargeCD <= 0) { e.state = 'rev'; e.st = 0.6; dust(e.x, 4); }
      }
      break;
    }
    case 'windup':
      e.st -= dt;
      if (e.st <= 0) {
        play(e, [[0.05, ESTRIKE], [0.25, EGUARD]]);
        sfx('whoosh');
        if (dist <= 24 * e.s) hurtPlayer(e, e.type === 'boss' ? 2 : 1);
        e.state = 'recover'; e.st = 0.4;
      }
      break;
    case 'throw':
      e.st -= dt;
      if (e.st <= 0) {
        play(e, [[0.05, ESTRIKE], [0.25, EGUARD]]);
        bullets.push({ x: e.x + e.f * 10, y: GY - 28, vx: e.f * (e.type === 'ninja' ? 240 : 200), ref: false, kind: e.type === 'ninja' ? 'star' : 'knife', owner: e });
        sfx('whoosh');
        e.state = 'recover'; e.st = 0.4;
      }
      break;
    case 'rev':
      e.st -= dt;
      if (Math.random() < dt * 20) dust(e.x - e.f * 6, 1);
      if (e.st <= 0) { e.state = 'charge'; e.cdir = dir; e.f = dir; e.hitP = false; sfx('whoosh'); }
      break;
    case 'charge':
      e.x += e.cdir * 190 * G.spdMul * dt;
      e.ph += dt * 40;
      if (Math.random() < dt * 25) dust(e.x - e.cdir * 6, 1);
      if (!e.hitP && Math.abs(player.x - e.x) < 12) { e.hitP = true; hurtPlayer(e, 2); }
      if ((e.x - player.x) * e.cdir > 45) {
        e.state = 'recover'; e.st = 1.0; e.chargeCD = rand(2.5, 4);
        text(e.x, GY - 50, 'WINDED', COL.dim, 8, 0.8);
      }
      break;
    case 'recover':
      e.st -= dt;
      if (e.st <= 0) e.state = 'walk';
      break;
    case 'stagger':
      e.x += e.vx * dt; e.vx *= Math.exp(-dt * 8);
      e.st -= dt;
      if (e.st <= 0) e.state = 'walk';
      break;
    case 'air':
      e.lv -= 430 * dt;
      e.lift += e.lv * dt;
      e.x += e.vx * dt;
      e.rot = -e.f * 0.5;
      if (e.lift <= 0 && e.lv < 0) {
        e.lift = 0; e.rot = 0; e.state = 'stagger'; e.st = 0.5; e.vx = 0;
        dust(e.x, 6); sfx('thud');
      }
      break;
    case 'aim':
      e.st -= dt;
      if (e.st <= 0) {
        const hx = e.x + e.f * 16;
        bullets.push({ x: hx, y: GY - 27, vx: e.f * 240, ref: false, kind: 'bullet', owner: e });
        addP({ k: 'muzzle', x: hx, y: GY - 27, r: 4, life: 0.06, col: '#fff2b0' });
        sfx('enemyGun');
        play(e, [[0.04, GUNR], [0.3, AIM]]);
        e.state = 'recover'; e.st = 0.9;
      }
      break;
    case 'jump': {
      e.jt += dt;
      const u = Math.min(1, e.jt / e.jd);
      e.x = lerp(e.jx0, e.jx1, u);
      e.lift = Math.sin(u * Math.PI) * 38;
      e.rot = Math.sign(e.jx1 - e.jx0) * u * TAU;
      if (u >= 1) { e.lift = 0; e.rot = 0; e.state = 'walk'; e.f = Math.sign(player.x - e.x) || 1; dust(e.x, 4); }
      break;
    }
  }
  animate(e, dt, basePose(e));
}

function updBullets(dt) {
  for (const b of bullets) {
    if (b.kind === 'nade') {
      b.vy += 500 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.spin = (b.spin || 0) + dt * 20;
      if (b.y >= GY - 3) { b.done = true; explode(b.x, GY - 10, 44, 5); }
      continue;
    }
    b.x += b.vx * dt;
    if (b.kind === 'ki' && Math.random() < 0.7) addP({ k: 'sq', x: b.x - Math.sign(b.vx) * 4, y: b.y + rand(-2, 2), vx: -b.vx * 0.1, vy: rand(-20, 20), life: 0.2, col: COL.ki, g: 0, sz: 2 });
    if (!b.ref) {
      if (Math.abs(b.x - player.x) < 6 && !player.dead) {
        b.done = true;
        if (player.inv <= 0 && G.mode === 'play') { hurtPlayer(b.owner, 1); sparks(player.x, GY - 24, Math.sign(b.vx), '#ff4060', 6); }
        continue;
      }
      for (const e of enemies) {
        if (e === b.owner || e.dead || e.state === 'jump' || e.state === 'air') continue;
        if (Math.abs(e.x - b.x) < 5) {
          b.done = true;
          hitEnemy(e, 3, Math.sign(b.vx), [150, 70], { snd: 'punch', noCombo: true, bullet: true, bonus: 'FRIENDLY FIRE', head: true });
          break;
        }
      }
    } else {
      for (const e of enemies) {
        if (e.dead || e.state === 'jump' || (e.state === 'air' && e.lift > 30)) continue;
        if (Math.abs(e.x - b.x) < 6) {
          b.done = true;
          const S = Math.sign(b.vx);
          if (b.kind === 'ki') {
            addP({ k: 'boom', x: b.x, y: b.y, r: 14, life: 0.25, col: COL.ki });
            sfx('kiHit');
            const near = enemies.filter(o => o !== e && !o.dead && Math.abs(o.x - b.x) < 18);
            hitEnemy(e, b.dmg, S, [260, 160], { heavy: true, spin: 8, noKi: true });
            near.forEach(o => hitEnemy(o, 2, S, [200, 140], { heavy: true, spin: 6, noKi: true, noCombo: true }));
          } else if (b.kind === 'axe') {
            hitEnemy(e, b.dmg, S, [180, 90], { snd: 'stab', heavy: true, spin: 5, bonus: 'TOMAHAWK' });
          } else {
            hitEnemy(e, 4, S, [170, 90], { snd: 'punch', bullet: true, bonus: 'RETURN TO SENDER', head: true });
          }
          break;
        }
      }
    }
    if (Math.abs(b.x - camX) > HALF + 60) b.done = true;
  }
  bullets = bullets.filter(b => !b.done);
}

function updItems(dt) {
  for (const it of items) {
    it.t += dt;
    if (!it.grounded) {
      it.vh -= 520 * dt;
      it.h += it.vh * dt;
      if (it.h <= 0) {
        it.h = 0;
        if (it.vh < -90) it.vh = -it.vh * 0.3; else { it.grounded = true; it.t = 0; dust(it.x, 3); }
      }
    }
  }
  items = items.filter(it => !(it.grounded && it.t > 14));
}

function updParticles(dt) {
  for (const p of parts) {
    p.t += dt;
    if (p.vx != null) {
      p.vy += (p.g || 0) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.y > GY + 2) {
        if (p.k === 'blood') { if (decals.length < 260) decals.push({ x: p.x, y: GY + randi(-1, 2), col: p.col, t: 0, w: randi(1, 3) }); p.t = p.life; }
        else if (p.bounce && p.vy > 0) { p.y = GY + 2; p.vy *= -0.4; p.vx *= 0.6; }
      }
    }
  }
  parts = parts.filter(p => p.t < p.life);
  for (const d of decals) d.t += dt;
  decals = decals.filter(d => d.t < 14);
  for (const t of texts) t.t += dt;
  texts = texts.filter(t => t.t < t.life);
  for (const g of G.ghosts) g.t += dt;
  G.ghosts = G.ghosts.filter(g => g.t < g.life);
}

function updRain(dt) {
  for (const d of rain) {
    d.y += d.v * dt;
    d.x -= d.v * dt * 0.22;
    if (d.x < -20) d.x += W + 40;
    if (d.y > d.fy) {
      if (d.fy > GY - 3 && Math.random() < 0.5 && splashes.length < 80) splashes.push({ x: d.x, y: d.fy, t: 0 });
      Object.assign(d, newDrop(false));
    }
  }
  for (const s of splashes) s.t += dt;
  splashes = splashes.filter(s => s.t < 0.18);
}

// ============================================================ input
// Each finger (or key) is a press. A press strikes at once when something is in reach.
// Otherwise it waits: let go quickly and it's a tap (a whiff if nothing came into reach), hold it and you run.
// Two presses on opposite sides at the same moment fire a ki special.
const presses = new Map();
function press(id, S) {
  if (G.mode === 'title') { newGame(); return; }
  if (G.mode === 'over') { if (G.overT > 1) newGame(); return; }
  if (G.paused) { G.paused = false; return; }
  if (player.dead) return;
  for (const p of presses.values()) {
    if (!p.used && p.S !== S && G.t - p.t0 < 0.2) {
      p.used = true;
      presses.set(id, { S, t0: G.t, used: true });
      padFlash[0] = padFlash[1] = 1;
      special();
      return;
    }
  }
  const p = { S, t0: G.t, acted: false, used: false, ran: false };
  presses.set(id, p);
  if (player.rush || player.beam) { p.acted = true; return; }
  if (player.lock > 0 || player.pending) { player.queue = S; p.acted = true; return; }
  if (plan(S)) { act(S); p.acted = true; }
}
function release(id) {
  const p = presses.get(id);
  if (!p) return;
  presses.delete(id);
  if (p.used || p.acted || p.ran || G.mode !== 'play' || G.paused || player.dead || player.rush || player.beam) return;
  if (player.lock > 0 || player.pending) { player.queue = p.S; return; }
  act(p.S);
}
function updPresses() {
  if (G.mode !== 'play') return;
  let run = 0, latest = -1;
  if (!G.paused && !player.dead) {
    for (const p of presses.values()) {
      if (p.used || G.t - p.t0 < HOLD_T) continue;
      p.ran = true;
      if (p.t0 > latest) { latest = p.t0; run = p.S; }
    }
  }
  player.run = run;
}

function update(dt) {
  G.t += dt;
  if (G.slow > 0) G.slow -= dt;
  const target = G.slow > 0 ? 0.3 : 1;
  G.timeScale = lerp(G.timeScale, target, 1 - Math.exp(-dt * (target < G.timeScale ? 22 : 6)));
  G.shake *= Math.exp(-dt * 12);
  G.flash = Math.max(0, G.flash - dt);
  G.comboPop = Math.max(0, G.comboPop - dt * 4);
  padFlash[0] = Math.max(0, padFlash[0] - dt * 5);
  padFlash[1] = Math.max(0, padFlash[1] - dt * 5);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.dur) G.banner = null; }
  if (G.named) { G.named.t += dt; if (G.named.t > 1.3) G.named = null; }
  if (G.mode === 'over') G.overT += dt;
  if (G.mode === 'play' && player.dead) {
    G.deathT += dt;
    if (G.deathT > 1.9) { G.mode = 'over'; G.overT = 0; }
  }
  updPresses();
  updRain(dt * (0.4 + 0.6 * G.timeScale));
  // Specials run on real time so slow motion doesn't drag them out.
  if (player.rush) updRush(dt);
  if (player.beam) updBeam(dt);
  if (G.hitstop > 0) { G.hitstop -= dt; return; }
  const sdt = dt * G.timeScale;
  if (G.mode === 'play') updWave(sdt);
  else if (G.mode === 'title') updAttract(sdt);
  updPlayer(sdt);
  for (const e of enemies) if (!e.dead) updEnemy(e, sdt);
  enemies = enemies.filter(e => !e.dead && Math.abs(e.x - camX) < HALF + 400);
  updBullets(sdt);
  updItems(sdt);
  updRagdolls(sdt);
  updParticles(sdt);
  camX = lerp(camX, player.x, 1 - Math.exp(-sdt * 5));
}

// ============================================================ drawing
const R = Math.round;
function seg(a, b) { ctx.moveTo(R(a.x), R(a.y)); ctx.lineTo(R(b.x), R(b.y)); }
function drawFig(J, col, dark, lw, hr, outline) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (outline) {
    ctx.strokeStyle = OUT; ctx.lineWidth = lw + 2;
    ctx.beginPath();
    seg(J.hip, J.k2); seg(J.k2, J.f2); seg(J.sh, J.e2); seg(J.e2, J.h2);
    seg(J.hip, J.neck); seg(J.hip, J.k1); seg(J.k1, J.f1); seg(J.sh, J.e1); seg(J.e1, J.h1);
    ctx.stroke();
    ctx.fillStyle = OUT; ctx.beginPath(); ctx.arc(R(J.head.x), R(J.head.y), hr + 1, 0, TAU); ctx.fill();
  }
  ctx.lineWidth = lw;

  ctx.beginPath(); seg(J.hip, J.k2); seg(J.k2, J.f2); seg(J.sh, J.e2); seg(J.e2, J.h2); ctx.stroke();
  ctx.strokeStyle = col;
  ctx.beginPath(); seg(J.hip, J.neck); seg(J.hip, J.k1); seg(J.k1, J.f1); seg(J.sh, J.e1); seg(J.e1, J.h1); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(R(J.head.x), R(J.head.y), hr, 0, TAU); ctx.fill();
}
function drawWeaponAt(E, Hh, type) {
  const dx = Hh.x - E.x, dy = Hh.y - E.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
  const hx = Hh.x, hy = Hh.y;

  const s = (off, len, col, w) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(R(hx + ux * off), R(hy + uy * off)); ctx.lineTo(R(hx + ux * (off + len)), R(hy + uy * (off + len))); ctx.stroke(); };

  switch (type) {
    case 'pistol': case 'dual': s(-1, 6, '#d6d6e2', 2); break;
    case 'shotgun': s(-5, 5, '#8a5a32', 2); s(0, 10, '#b8b8c8', 2); break;
    case 'katana': s(-4, 4, '#3a2a3a', 2); s(0, 1, '#ffcf4a', 4); s(1, 16, '#eaf4ff', 1.5); break;
    case 'pencil': s(-1, 6, '#ffd23a', 2); s(5, 2, '#2a2030', 2); break;
    case 'nunchaku': {
      s(-1, 5, '#a8743a', 2);
      const a = Math.atan2(uy, ux) + Math.sin(G.t * 25) * 1.3;
      const cx = hx + ux * 4, cy = hy + uy * 4, jx = cx + Math.cos(a) * 3, jy = cy + Math.sin(a) * 3;
      ctx.strokeStyle = '#9a9aae'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(R(cx), R(cy)); ctx.lineTo(R(jx), R(jy)); ctx.stroke();
      ctx.strokeStyle = '#a8743a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(R(jx), R(jy)); ctx.lineTo(R(jx + Math.cos(a) * 5), R(jy + Math.sin(a) * 5)); ctx.stroke();
      break;
    }
    case 'hammer': s(-4, 15, '#7a5a3a', 2); perp(11, 3, '#6f7480', 4); break;
    case 'axe': s(-2, 9, '#7a5a3a', 2); perp(5, 2.5, '#d6d6e2', 3); break;
    case 'grenade': ctx.fillStyle = '#4f8a3a'; ctx.beginPath(); ctx.arc(R(hx), R(hy), 2, 0, TAU); ctx.fill(); break;
  }

function drawPlayer(refl) {
  const p = player;
  const J = solveFig(p.pose, p.x, p.f, 1, p.lift, p.rot);
  if (!refl) p.J = J;
  const ga = ctx.globalAlpha;
  const aura = p.super > 0 ? COL.gold : (p.ki >= KI_MAX || p.beam || p.rush) ? COL.ki : null;
  if (aura && !refl) {
    ctx.globalAlpha = ga * (0.25 + 0.15 * Math.sin(G.t * 30));
    drawFig(J, aura, aura, 6, BODY.head + 3, false);
    ctx.globalAlpha = ga;
  }
  if (p.inv > 0 && p.inv < 50 && Math.floor(G.t * 22) % 2 === 0) ctx.globalAlpha *= 0.35;
  drawFig(J, COL.player, COL.playerDark, 2, BODY.head, !refl);
  const f = p.f, h = J.head;
  if (p.super > 0) {
    ctx.fillStyle = COL.gold;
    ctx.beginPath(); ctx.arc(h.x, h.y, BODY.head + 0.5, Math.PI, TAU); ctx.fill();
    for (const [tx, ty] of [[-7, -5], [-4, -9], [-1, -9], [2, -7]]) {
      ctx.beginPath();
      ctx.moveTo(R(h.x + f * (tx * 0.35 - 1.5)), R(h.y - 2));
      ctx.lineTo(R(h.x + f * (tx * 0.35 + 1.5)), R(h.y - 2));
      ctx.lineTo(R(h.x + f * tx), R(h.y + ty));
      ctx.closePath(); ctx.fill();
    }
  } else {
    ctx.fillStyle = COL.hair;
    ctx.beginPath();
    if (f > 0) ctx.arc(h.x, h.y, BODY.head + 0.4, Math.PI * 0.95, Math.PI * 1.75);
    else ctx.arc(h.x, h.y, BODY.head + 0.4, -Math.PI * 0.75, Math.PI * 0.05);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = COL.hair; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(R(h.x - f * 2), R(h.y - 1)); ctx.lineTo(R(h.x - f * 5), R(h.y + 4)); ctx.stroke();
  }
  ctx.fillStyle = COL.hair;
  ctx.fillRect(R(h.x + f * 1 - (f < 0 ? 2 : 0)), R(h.y + 1.5), 2, 2);
  ctx.strokeStyle = COL.tie; ctx.lineWidth = 1;

  if (p.weapon) {
    drawWeaponAt(J.e1, J.h1, p.weapon);
    if (p.weapon === 'dual') drawWeaponAt(J.e2, J.h2, 'dual');
  }
  ctx.globalAlpha = ga;
}

function drawEnemy(e, refl) {
  const jit = e.state === 'rev' ? rand(-1, 1) : 0;
  const J = solveFig(e.pose, e.x + jit, e.f, e.s, e.lift, e.rot);
  if (!refl) e.J = J;
  let col = e.col;
  const dark = e.flash > 0 ? '#ffffff' : e.dark;
  if (e.flash > 0) col = '#ffffff';
  else if ((e.state === 'windup' || e.state === 'throw' || e.state === 'rev') && Math.floor(G.t * 18) % 2 === 0) col = '#ffffff';
  if (e.state === 'charge' && !refl) {
    ctx.globalAlpha = 0.35;
    drawFig(J, COL.red, COL.red, e.lw + 4, BODY.head * e.s + 2, false);
    ctx.globalAlpha = 1;
  }
  drawFig(J, col, dark, e.lw, BODY.head * e.s, !refl);
  const h = J.head, f = e.f;
  switch (e.type) {
    case 'gunman':
      drawWeaponAt(J.e1, J.h1, 'pistol');
      ctx.fillStyle = '#5a3d0a';
      ctx.fillRect(R(h.x - 4), R(h.y - 4), 8, 2);
      ctx.fillRect(R(f > 0 ? h.x + 2 : h.x - 7), R(h.y - 3), 5, 1);
      break;
    case 'dodger':
      ctx.strokeStyle = '#ff2e88'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(R(h.x - 3), R(h.y - 1)); ctx.lineTo(R(h.x + 3), R(h.y - 1));
      ctx.moveTo(R(h.x - f * 3), R(h.y - 1)); ctx.lineTo(R(h.x - f * 8), R(h.y + 1 + Math.sin(G.t * 12) * 1.5)); ctx.stroke();
      break;
    case 'ninja':
      ctx.fillStyle = OUT; ctx.fillRect(R(h.x - 3), R(h.y - 1), 7, 2);
      ctx.strokeStyle = COL.red; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(R(J.neck.x), R(J.neck.y)); ctx.lineTo(R(J.neck.x - f * 7), R(J.neck.y + 2 + Math.sin(G.t * 14) * 2)); ctx.stroke();
      break;
    case 'shield':
      if (e.guard) {
        ctx.fillStyle = '#5a6a88'; ctx.fillRect(R(J.h1.x + f * 1 - 1), R(J.h1.y - 9), 3, 16);
        ctx.fillStyle = '#c9d8ff'; ctx.fillRect(R(J.h1.x + f * 1 - 1 + (f > 0 ? 2 : 0)), R(J.h1.y - 9), 1, 16);
      }
      ctx.fillStyle = '#3a4a68'; ctx.fillRect(R(h.x - 4), R(h.y - 4), 8, 3);
      break;
    case 'charger':
      ctx.fillStyle = OUT; ctx.fillRect(R(h.x - 4), R(h.y - 5), 9, 3);
      ctx.fillStyle = '#ffe0f5'; ctx.fillRect(R(h.x + f * 3), R(h.y - 7), 1, 3); ctx.fillRect(R(h.x - f * 3), R(h.y - 7), 1, 3);
      break;
    case 'boss':

      ctx.fillRect(R(f > 0 ? h.x - 1 : h.x - 4), R(h.y - 1), 5, 2);
      ctx.strokeStyle = '#ffcf4a'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(R(J.neck.x), R(J.neck.y + 1)); ctx.lineTo(R(lerp(J.neck.x, J.hip.x, 0.4)), R(lerp(J.neck.y, J.hip.y, 0.4))); ctx.stroke();

    case 'brawler':

      break;
  }
}

function drawRagdoll(r, refl) {
  const a = r.life > 5.5 ? Math.max(0, 1 - (r.life - 5.5) / 1.5) : 1;
  const ga = ctx.globalAlpha;
  ctx.globalAlpha = ga * a;
  const J = {};
  for (const n of RD_N) J[n] = r.P[n];
  const col = r.flash > 0 ? '#fff' : r.col;
  drawFig(J, col, r.flash > 0 ? '#fff' : r.dark, r.lw, BODY.head * r.s, !refl);
  ctx.globalAlpha = ga;
}

function drawActors(refl) {
  for (const r of ragdolls) drawRagdoll(r, refl);
  if (!refl) {
    for (const g of G.ghosts) {
      ctx.globalAlpha = 0.45 * (1 - g.t / g.life);
      drawFig(g.J, g.col, g.col, 2, BODY.head, false);
    }

  }
  for (const e of enemies) if (!e.dead) drawEnemy(e, refl);
  if (!player.dead) drawPlayer(refl);
}

function drawItemIcon(type, x, y) {

    case 'dual': F('#d6d6e2', -6, -4, 7, 2); F('#9a9aae', -6, -2, 2, 2); F('#d6d6e2', -1, -1, 7, 2); F('#9a9aae', -1, 1, 2, 2); break;
    case 'shotgun': F('#b8b8c8', -2, -3, 9, 2); F('#8a5a32', -8, -2, 6, 2); F('#8a5a32', -8, 0, 2, 2); break;

    case 'pencil': F('#ffd23a', -4, -2, 7, 2); F('#ff9ec4', -5, -2, 1, 2); F('#2a2030', 3, -2, 2, 2); break;
    case 'nunchaku': F('#a8743a', -6, -4, 2, 6); F('#9a9aae', -4, -4, 4, 1); F('#a8743a', 0, -4, 6, 2); break;
    case 'hammer': F('#7a5a3a', -6, -2, 10, 2); F('#6f7480', 3, -5, 4, 8); break;

    case 'grenade': F('#4f8a3a', -3, -3, 6, 6); F('#2f5a22', -3, 0, 6, 1); F('#c9c9d6', -1, -5, 3, 2); break;

}
const HEART = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
function drawHeart(x, y, col) {
  ctx.fillStyle = col;

function drawItems() {
  for (const it of items) {

    if (blink) continue;

    const glow = 0.25 + 0.15 * Math.sin(G.t * 6);
    ctx.fillStyle = it.type === 'heart' ? `rgba(255,51,85,${glow})` : `rgba(255,207,74,${glow})`;
    ctx.beginPath(); ctx.arc(R(it.x), R(y - 1), 7, 0, TAU); ctx.fill();

      ctx.beginPath(); ctx.moveTo(R(it.x - 6), R(y - 14)); ctx.lineTo(R(it.x), R(y - 3)); ctx.lineTo(R(it.x + 6), R(y - 14)); ctx.stroke();
      ctx.fillStyle = '#e0213c'; ctx.beginPath(); ctx.arc(R(it.x), R(y - 14), 7, Math.PI, TAU); ctx.fill();

function drawSign(s, ox, t) {

  ctx.fillRect(x, y, s.w, s.h);

    ctx.fillRect(x + 2 + jx, GY + 6 + yy, s.w - 4, 1);

function drawBackground() {
  const t = G.t;
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, GY);
  for (const s of stars) {
    const tw = s.b ? 0.9 : 0.35 + 0.3 * Math.sin(t * 2 + s.p);
    ctx.fillStyle = `rgba(255,240,255,${tw})`;
    ctx.fillRect(R(mod(s.x - camX * 0.02, W)), R(s.y), 1, 1);
  }
  const mx = R(W * 0.76 - camX * 0.03), my = R(GY * 0.2);
  ctx.fillStyle = 'rgba(255,120,180,0.08)'; ctx.beginPath(); ctx.arc(mx, my, 28, 0, TAU); ctx.fill();

  ctx.fillStyle = '#0a0912'; ctx.fillRect(0, GY, W, H - GY);
